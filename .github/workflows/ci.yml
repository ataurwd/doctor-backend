name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Verify Express Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification test
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: test-secret-key-123456
          API_SECRET_KEY: test-api-secret-123456
          CLIENT_HANDSHAKE_TOKEN: test-handshake-token-123456
